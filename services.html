<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Services | Ahmed Hamid Architecture</title>
<meta name="description" content="Architectural design, interior design, construction drawings, quantity take-off, project management and facade renovation services.">
<meta property="og:title" content="Services — Ahmed Hamid Architecture">
<meta property="og:image" content="assets/logo.png">
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="site-header"></header>

<section class="hero" style="padding-bottom:30px">
  <div class="hero-grid"></div>
  <div class="container" style="grid-template-columns:1fr">
    <div class="reveal in">
      <div class="eyebrow">What We Do</div>
      <h1>Services</h1>
      <p class="lead">From first sketch to final quantity take-off — the full architectural process, handled in-house.</p>
    </div>
  </div>
</section>

<section class="reveal">
  <div class="container">
    <div id="services-list">
      <div class="skel skel-line" style="width:60%;height:20px;margin-bottom:16px"></div>
      <div class="skel skel-line" style="width:90%;height:14px;margin-bottom:24px"></div>
      <div class="skel skel-line" style="width:55%;height:20px;margin-bottom:16px"></div>
      <div class="skel skel-line" style="width:80%;height:14px"></div>
    </div>
  </div>
</section>

<div id="cta-band"></div>
<footer id="site-footer"></footer>
<script src="script.js"></script>
<script>
renderCtaBand();
async function loadServices(){
  const mount = document.getElementById("services-list");
  try{
    const rows = await SB.select("services", "select=title,description&order=sort_order.asc");
    if(!rows.length){ mount.innerHTML = `<p style="color:var(--gray)">Services will appear here once added from the admin panel.</p>`; return; }
    mount.innerHTML = rows.map((s,i) => `
      <div class="service-item">
        <div class="idx">${String(i+1).padStart(2,'0')}</div>
        <h3>${s.title}</h3>
        <p>${s.description || ''}</p>
      </div>`).join("");
  }catch(e){
    mount.innerHTML = `<p style="color:var(--gray)">Services will appear here once the database is connected.</p>`;
  }
  initReveal();
}
loadServices();
</script>
</body>
</html>
