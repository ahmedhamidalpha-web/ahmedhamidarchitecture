<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ahmed Hamid Architecture | Blog</title>
  <link rel="stylesheet" href="style.css">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-S8XNQKS8F3"></script>
</head>
<body>

  <header>
    <div class="header-brand">
      <img src="assets/logo.png" alt="Ahmed Hamid Architecture Logo">
      <div class="brand-titles">
        <h1>Ahmed Hamid Architecture</h1>
        <p>Modern Design | Innovative Space</p>
      </div>
    </div>
  </header>

  <nav class="main-nav">
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About Us</a></li>
      <li><a href="services.html">Services</a></li>
      <li><a href="projects.html">Projects</a></li>
      <li><a href="blog.html" class="active">Blog</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="admin.html">Admin</a></li>
    </ul>
  </nav>

  <main class="content">
    <h2 style="color: var(--primary-blue); font-size: 2rem; margin-bottom: 25px;">المدونة المعمارية والنشرات</h2>
    <div id="blog-posts-feed">
      <p style="color: var(--text-muted);">جاري تحميل المقالات والمنشورات...</p>
    </div>
  </main>

  <div id="footer-container"></div>

  <script src="script.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      document.getElementById('footer-container').innerHTML = generateGlobalFooter();
      await renderBlogFeed();
    });

    async function renderBlogFeed() {
      const posts = await supabaseFetch('blog_posts?select=*&order=created_at.desc');
      const feed = document.getElementById('blog-posts-feed');
      if(posts && posts.length > 0) {
        feed.innerHTML = '';
        for(let post of posts) {
          const comments = await supabaseFetch(`comments?post_id=eq.${post.id}&order=created_at.asc`);
          const postElement = document.createElement('article');
          postElement.style.cssText = 'background: var(--surface-white); padding: 35px; border-radius: var(--radius-md); border: 1px solid var(--border-color); margin-bottom: 30px; box-shadow: var(--shadow-sm);';
          
          let commentsHTML = comments && comments.length > 0 ? comments.map(c => `
            <div style="background: var(--light-bg); padding: 12px 18px; border-radius: var(--radius-sm); margin-bottom: 8px;">
              <strong style="color: var(--primary-blue);">${c.username}:</strong>
              <p style="color: var(--text-secondary); font-size: 0.95rem;">${c.comment}</p>
            </div>
          `).join('') : '<p style="color: var(--text-muted); font-size: 0.9rem;">كن أول من يعلق على هذا المنشور.</p>';

          postElement.innerHTML = `
            <h3 style="color: var(--primary-blue); font-size: 1.5rem; margin-bottom: 10px;">${post.title}</h3>
            <p style="color: var(--text-secondary); font-size: 1.05rem; margin-bottom: 20px;">${post.content}</p>
            <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 20px 0;">
            <h4 style="color: var(--primary-blue); margin-bottom: 15px;">التعليقات:</h4>
            <div style="margin-bottom: 20px;">${commentsHTML}</div>
            <form onsubmit="handleCommentSubmit(event, '${post.id}')" style="display: flex; gap: 10px;">
              <input type="text" class="form-control" placeholder="اكتب تعليقك هنا..." required style="flex: 1;">
              <button type="submit" class="btn">إرسال</button>
            </form>
          `;
          feed.appendChild(postElement);
        }
      } else {
        feed.innerHTML = `<p style="color: var(--text-secondary);">لا توجد منشورات متاحة في المدونة حالياً.</p>`;
      }
    }

    async function handleCommentSubmit(event, postId) {
      event.preventDefault();
      const input = event.target.querySelector('input');
      const text = input.value.trim();
      if(!text) return;

      let userTag = localStorage.getItem('aha_visitor_tag');
      if(!userTag) {
        userTag = 'Architect_Visitor_' + Math.floor(1000 + Math.random() * 9000);
        localStorage.setItem('aha_visitor_tag', userTag);
      }

      await supabaseFetch('comments', 'POST', {
        post_id: postId,
        username: userTag,
        comment: text
      });

      input.value = '';
      await renderBlogFeed();
    }
  </script>
</body>
</html>
