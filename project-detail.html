<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تفاصيل المشروع | Ahmed Hamid Architecture</title>
  <link rel="stylesheet" href="style.css">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-S8XNQKS8F3"></script>
</head>
<body>

  <header>
    <div class="header-brand">
      <img src="assets/logo.png" alt="Ahmed Hamid Architecture Logo">
      <div class="brand-titles">
        <h1>Ahmed Hamid Architecture</h1>
        <p>Modern Design | Innovative Space</p>
      </div>
    </div>
  </header>

  <nav class="main-nav">
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About Us</a></li>
      <li><a href="services.html">Services</a></li>
      <li><a href="projects.html" class="active">Projects</a></li>
      <li><a href="blog.html">Blog</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="admin.html">Admin</a></li>
    </ul>
  </nav>

  <main class="content">
    <div id="project-detail-box" style="background: var(--surface-white); padding: 40px; border-radius: var(--radius-md); border: 1px solid var(--border-color);">
      <h2 id="proj-title" style="color: var(--primary-blue); font-size: 2.2rem; margin-bottom: 20px;">...</h2>
      <img id="proj-cover" src="" alt="Cover" style="width: 100%; max-height: 500px; object-fit: cover; border-radius: var(--radius-md); margin-bottom: 30px;">

      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; background: var(--light-bg); padding: 25px; border-radius: var(--radius-sm); margin-bottom: 30px;">
        <div><strong>موقع المشروع:</strong> <span id="proj-location">-</span></div>
        <div><strong>مساحة الأرض:</strong> <span id="proj-land-area">-</span></div>
        <div><strong>المساحة المبنية:</strong> <span id="proj-built-area">-</span></div>
        <div><strong>النظام الإنشائي:</strong> <span id="proj-structure">-</span></div>
      </div>

      <div style="margin-bottom: 30px;">
        <h3 style="color: var(--accent-blue); margin-bottom: 10px;">الفكرة التصميمية</h3>
        <p id="proj-concept" style="color: var(--text-secondary); font-size: 1.05rem;">-</p>
      </div>

      <div style="margin-bottom: 30px;">
        <h3 style="color: var(--accent-blue); margin-bottom: 10px;">التحديات والحلول المعمارية</h3>
        <p id="proj-challenges" style="color: var(--text-secondary); font-size: 1.05rem;">-</p>
      </div>

      <h3 style="color: var(--primary-blue); margin-bottom: 20px;">صور ومخططات المشروع</h3>
      <div id="proj-gallery" class="grid-cards"></div>
    </div>
  </main>

  <div id="footer-container"></div>

  <script src="script.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      document.getElementById('footer-container').innerHTML = generateGlobalFooter();
      
      const urlParams = new URLSearchParams(window.location.search);
      const projId = urlParams.get('id');
      if(!projId) return;

      const res = await supabaseFetch(`projects?id=eq.${projId}`);
      if(res && res.length > 0) {
        const p = res[0];
        document.getElementById('proj-title').innerText = p.title;
        document.getElementById('proj-cover').src = p.cover_url || 'assets/logo.png';
        document.getElementById('proj-location').innerText = p.location || 'غير محدد';
        document.getElementById('proj-land-area').innerText = p.land_area || 'غير محدد';
        document.getElementById('proj-built-area').innerText = p.built_area || 'غير محدد';
        document.getElementById('proj-structure').innerText = p.structural_system || 'غير محدد';
        document.getElementById('proj-concept').innerText = p.concept || 'لا يوجد تفاصيل مسجلة';
        document.getElementById('proj-challenges').innerText = p.challenges || 'لا يوجد تفاصيل مسجلة';

        // Render project images from Google Drive
        const gallery = document.getElementById('proj-gallery');
        let images = [];
        try { images = JSON.parse(p.images_json || '[]'); } catch(e){}
        if(images.length > 0) {
          gallery.innerHTML = images.map(imgUrl => `
            <div class="card">
              <img src="${imgUrl}" alt="صورة من المشروع">
              <div class="card-body" style="padding: 15px; text-align: center;">
                <a href="${imgUrl}" download target="_blank" class="btn" style="width: 100%;">تحميل الصورة</a>
              </div>
            </div>
          `).join('');
        } else {
          gallery.innerHTML = `<p style="color: var(--text-muted);">لا توجد صور إضافية للمشروع.</p>`;
        }
      }
    });
  </script>
</body>
</html>
