<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About Us | Ahmed Hamid Architecture</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="site-header"></header>

<section class="hero" style="padding-bottom:40px">
  <div class="hero-grid"></div>
  <div class="container" style="grid-template-columns:1fr">
    <div>
      <div class="eyebrow">About the studio</div>
      <h1 id="about-intro-title">About Ahmed Hamid Architecture</h1>
      <p class="lead" id="about-intro-text" style="max-width:640px">Loading…</p>
    </div>
  </div>
</section>

<section>
  <div class="container grid grid-3" id="about-departments"></div>
</section>

<section style="background:var(--white);border-top:1px solid var(--line);border-bottom:1px solid var(--line)">
  <div class="container" style="display:grid;grid-template-columns:1fr 1fr;gap:40px">
    <div>
      <div class="eyebrow">Vision</div>
      <p id="about-vision" style="color:var(--gray)">Loading…</p>
    </div>
    <div>
      <div class="eyebrow">Mission & Goals</div>
      <p id="about-mission" style="color:var(--gray)">Loading…</p>
    </div>
  </div>
</section>

<section id="experience-section" style="display:none">
  <div class="container">
    <div class="eyebrow">Experience</div>
    <h2>Track Record</h2>
    <div class="stat-row" id="about-stats"></div>
  </div>
</section>

<footer id="site-footer"></footer>
<script src="script.js"></script>
<script>
async function loadAbout(){
  try{
    const rows = await SB.select("site_content", "select=value&key=eq.about");
    const v = rows[0]?.value || {};
    if(v.title) document.getElementById("about-intro-title").textContent = v.title;
    if(v.intro) document.getElementById("about-intro-text").textContent = v.intro;
    document.getElementById("about-vision").textContent = v.vision || "—";
    document.getElementById("about-mission").textContent = v.mission || "—";

    const deptMount = document.getElementById("about-departments");
    const depts = v.departments || [];
    deptMount.innerHTML = depts.length ? depts.map(d => `
      <div class="card"><div class="body">
        <h3>${d.name}</h3>
        <p style="color:var(--gray);font-size:14px">${d.description || ''}</p>
      </div></div>`).join("") : "";

    if(v.stats && v.stats.length){
      document.getElementById("experience-section").style.display = "block";
      document.getElementById("about-stats").innerHTML = v.stats.map(s => `
        <div class="stat"><div class="num">${s.value}</div><div class="lbl">${s.label}</div></div>`).join("");
    }
  }catch(e){
    document.getElementById("about-intro-text").textContent = "Content will appear here once added from the admin panel.";
  }
}
loadAbout();
</script>
</body>
</html>
